[project]
name = "mle-data-pipeline-and-modeling"
version = "0.1.0"
requires-python = ">=3.13.17"
dependencies = [
    "click>=8.5.0",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.12",
    "pyarrow>=25.0.1",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[tool.uv]
required-version = ">=0.13.5"
# Apply certificate fixes without adding unused runtime packages.
constraint-dependencies = ["certifi>=2026.10.19", "pip>=26.2.2"]
